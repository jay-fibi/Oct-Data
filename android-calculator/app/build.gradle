plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jayfibi.calculator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jayfibi.calculator'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    lint {
        abortOnError true
    }
}