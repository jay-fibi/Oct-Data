plugins { id 'com.android.application' }

android {
    namespace 'com.jacks.stocks'
    compileSdk 35
    defaultConfig {
        applicationId 'com.jacks.stocks'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
    buildFeatures { buildConfig true }
    lint { abortOnError true }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Platform-provided legacy runner, test APK only; nothing bundled into the application.
dependencies {
    androidTestCompileOnly files(
        "${android.sdkDirectory}/platforms/android-35/optional/android.test.base.jar",
        "${android.sdkDirectory}/platforms/android-35/optional/android.test.runner.jar",
        "${android.sdkDirectory}/platforms/android-35/optional/android.test.mock.jar"
    )
}